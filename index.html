<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tiffin Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2255%22 r=%2240%22 fill=%22%23FFB300%22/><circle cx=%2270%22 cy=%2212%22 r=%2210%22 fill=%22%23141414%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="wrap">

  <header class="site-header">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="70" cy="14" r="11" fill="#141414"/>
        <path d="M50 20 a30 30 0 0 1 26 45 L24 50 a30 30 0 0 1 26 -30 Z" fill="#FFB300"/>
        <path d="M20 55 a30 30 0 1 0 60 0 Z" fill="#FFB300"/>
      </svg>
      <div>
        <h1>Tiffin Tracker</h1>
        <p class="brand-sub">Tiffin On Demand &middot; personal log</p>
      </div>
    </div>
    <div class="save-status" id="saveStatus" aria-live="polite"></div>
  </header>

  <section class="dashboard" aria-label="Summary">
    <div class="gauge-card">
      <svg class="gauge" viewBox="0 0 160 160" aria-hidden="true">
        <circle class="gauge-track" cx="80" cy="80" r="68"></circle>
        <circle class="gauge-fill" id="gaugeFill" cx="80" cy="80" r="68"></circle>
      </svg>
      <div class="gauge-center">
        <span id="gaugePending">0</span>
        <small>pending</small>
      </div>
    </div>

    <div class="stat-cards">
      <div class="stat-card">
        <span class="stat-label">Total purchased</span>
        <span class="stat-value" id="statTotal">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Used</span>
        <span class="stat-value" id="statUsed">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Pending</span>
        <span class="stat-value" id="statPending">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Total spent</span>
        <span class="stat-value" id="statSpent">&#8377;0</span>
      </div>
    </div>
  </section>

  <section class="panels">

    <div class="panel">
      <h2>Log a tiffin</h2>
      <form id="entryForm">
        <label>
          Date
          <input type="date" id="entryDate" required />
        </label>
        <label>
          Number of tiffins
          <input type="number" id="entryCount" min="1" step="1" value="1" required />
        </label>
        <label>
          Note <span class="optional">(optional)</span>
          <input type="text" id="entryNote" placeholder="e.g. double order, skipped lunch" />
        </label>
        <button type="submit" class="btn-primary">Add entry</button>
      </form>
    </div>

    <div class="panel">
      <h2>Current plan</h2>
      <div id="currentPlanView" class="current-plan"></div>
      <button id="showPlanForm" class="btn-secondary" type="button">Change subscription</button>

      <form id="planForm" class="hidden">
        <label>
          Price paid (&#8377;)
          <input type="number" id="planPrice" min="0" step="1" required />
        </label>
        <label>
          Tiffins in this plan
          <input type="number" id="planCount" min="1" step="1" required />
        </label>
        <label>
          Start date
          <input type="date" id="planDate" required />
        </label>
        <p class="hint">Any tiffins pending from your last plan carry forward automatically &mdash; nothing is lost.</p>
        <div class="form-actions">
          <button type="submit" class="btn-primary">Save new plan</button>
          <button type="button" id="cancelPlanForm" class="btn-secondary">Cancel</button>
        </div>
      </form>
    </div>

  </section>

  <section class="history">
    <div class="history-header">
      <h2>History</h2>
      <span class="history-count" id="historyCount"></span>
    </div>
    <div id="historyList" class="history-list"></div>
    <p id="historyEmpty" class="empty-state hidden">No tiffins logged yet. Add your first entry above.</p>
  </section>

</div>

<script src="app.js"></script>
</body>
</html>
