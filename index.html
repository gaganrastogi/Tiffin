<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOD Tiffin Tracker</title>
    <style>
        /* Mobile-first, Dark Theme with TOD Yellow */
        :root {
            --bg-color: #000000;
            --card-bg: #1a1a1a;
            --tod-yellow: #FFB703; /* Yellow from your logo */
            --text-light: #ffffff;
            --text-dim: #a0a0a0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            padding-bottom: 80px; /* Space for scrolling on mobile */
        }

        h1, h2, h3 {
            color: var(--tod-yellow);
            margin-top: 0;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--tod-yellow);
            padding-bottom: 10px;
        }

        .header h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
            margin: 0;
        }

        /* Dashboard Cards */
        .dashboard {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 25px;
        }

        .stat-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            flex: 1;
            text-align: center;
            border-left: 4px solid var(--tod-yellow);
        }

        .stat-card h3 {
            font-size: 0.9rem;
            color: var(--text-dim);
            margin-bottom: 5px;
        }

        .stat-card .number {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--text-light);
        }

        /* Forms and Inputs */
        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--tod-yellow);
            font-size: 0.9rem;
        }

        input[type="date"],
        input[type="number"],
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background-color: var(--bg-color);
            border: 1px solid #333;
            color: var(--text-light);
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: var(--tod-yellow);
        }

        button {
            background-color: var(--tod-yellow);
            color: var(--bg-color);
            border: none;
            padding: 12px 20px;
            width: 100%;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
        }

        button:active {
            opacity: 0.8;
        }

        /* Ledger / History Table */
        .history-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .history-item {
            background-color: var(--bg-color);
            border: 1px solid #333;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-details {
            display: flex;
            flex-direction: column;
        }

        .history-date {
            font-size: 0.85rem;
            color: var(--tod-yellow);
            margin-bottom: 4px;
        }

        .history-note {
            font-size: 0.9rem;
            color: var(--text-dim);
        }

        .history-qty {
            font-size: 1.2rem;
            font-weight: bold;
            background-color: #333;
            padding: 5px 12px;
            border-radius: 4px;
        }

        /* Settings Toggle */
        .settings-btn {
            background-color: transparent;
            color: var(--tod-yellow);
            border: 1px solid var(--tod-yellow);
            margin-top: 10px;
        }

        #settingsSection {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>T O D</h1>
        <div style="color: var(--text-dim); font-size: 0.8rem;">TIFFIN TRACKER</div>
    </div>

    <!-- Dashboard Summary -->
    <div class="dashboard">
        <div class="stat-card">
            <h3>TOTAL</h3>
            <div class="number" id="dashTotal">20</div>
        </div>
        <div class="stat-card">
            <h3>USED</h3>
            <div class="number" id="dashUsed">0</div>
        </div>
        <div class="stat-card" style="border-left-color: #4CAF50;">
            <h3>PENDING</h3>
            <div class="number" id="dashPending" style="color: #4CAF50;">20</div>
        </div>
    </div>

    <!-- Log Tiffin Form -->
    <div class="card">
        <h2>Log Tiffins</h2>
        <form id="logForm">
            <label for="logDate">Date</label>
            <input type="date" id="logDate" required>

            <label for="logQty">Number of Tiffins</label>
            <input type="number" id="logQty" value="1" min="1" required>

            <label for="logNote">Note (Optional)</label>
            <input type="text" id="logNote" placeholder="e.g., Lunch and Dinner">

            <button type="submit">Save Entry</button>
        </form>
    </div>

    <!-- History / Ledger -->
    <div class="card">
        <h2>History</h2>
        <ul class="history-list" id="historyList">
            <!-- Entries will appear here -->
        </ul>
    </div>

    <!-- Subscription Settings -->
    <button class="settings-btn" id="toggleSettingsBtn">Change Subscription Plan</button>
    
    <div class="card" id="settingsSection" style="margin-top: 20px;">
        <h2>Update Plan</h2>
        <p style="font-size: 0.85rem; color: var(--text-dim);">Set a new baseline when you renew your subscription.</p>
        <form id="settingsForm">
            <label for="setTotal">Total Tiffins Provided</label>
            <input type="number" id="setTotal" required>
            
            <label for="setPrice">Price (Rs.)</label>
            <input type="number" id="setPrice" required>

            <button type="submit">Update Plan & Reset Logs</button>
        </form>
    </div>
</div>

<script>
    // --- Data Management (Local Storage) ---
    
    // Default structure for the first time loading
    const defaultData = {
        planTotal: 20,
        planPrice: 1000,
        logs: [] // Array to hold { date, qty, note }
    };

    // Load data from browser storage or use defaults
    let appData = JSON.parse(localStorage.getItem('todTrackerData')) || defaultData;

    // Save data back to browser storage
    function saveData() {
        localStorage.setItem('todTrackerData', JSON.stringify(appData));
        updateUI();
    }

    // --- UI Elements ---
    const dashTotal = document.getElementById('dashTotal');
    const dashUsed = document.getElementById('dashUsed');
    const dashPending = document.getElementById('dashPending');
    const historyList = document.getElementById('historyList');
    
    const logDateInput = document.getElementById('logDate');
    const logForm = document.getElementById('logForm');
    const settingsForm = document.getElementById('settingsForm');
    
    // Set today's date automatically in the input
    logDateInput.value = new Date().toISOString().split('T')[0];

    // --- Core Logic ---

    // Calculate totals and update the screen
    function updateUI() {
        // Calculate total used
        let totalUsed = 0;
        appData.logs.forEach(log => {
            totalUsed += parseInt(log.qty);
        });

        const pending = appData.planTotal - totalUsed;

        // Update Dashboard
        dashTotal.innerText = appData.planTotal;
        dashUsed.innerText = totalUsed;
        dashPending.innerText = pending;

        // Visual warning if pending is low/negative
        if (pending <= 3) {
            dashPending.style.color = "#f44336"; // Red warning
        } else {
            dashPending.style.color = "#4CAF50"; // Green ok
        }

        // Update Settings Inputs to match current data
        document.getElementById('setTotal').value = appData.planTotal;
        document.getElementById('setPrice').value = appData.planPrice;

        // Render History List
        historyList.innerHTML = ''; // Clear current list
        
        // Loop through logs backwards so newest is on top
        for (let i = appData.logs.length - 1; i >= 0; i--) {
            const log = appData.logs[i];
            const li = document.createElement('li');
            li.className = 'history-item';
            
            // Format date nicely (YYYY-MM-DD)
            li.innerHTML = `
                <div class="history-details">
                    <span class="history-date">${log.date}</span>
                    <span class="history-note">${log.note ? log.note : '<em>No note</em>'}</span>
                </div>
                <div class="history-qty">-${log.qty}</div>
            `;
            historyList.appendChild(li);
        }
        
        if(appData.logs.length === 0) {
            historyList.innerHTML = '<li style="text-align:center; color: #a0a0a0; padding: 10px;">No tiffins used yet.</li>';
        }
    }

    // --- Event Listeners ---

    // Handle adding a new log
    logForm.addEventListener('submit', function(e) {
        e.preventDefault(); // Prevent page refresh
        
        const newLog = {
            date: document.getElementById('logDate').value,
            qty: parseInt(document.getElementById('logQty').value),
            note: document.getElementById('logNote').value
        };

        appData.logs.push(newLog);
        saveData(); // Saves and updates UI
        
        // Reset form inputs (except date)
        document.getElementById('logQty').value = 1;
        document.getElementById('logNote').value = '';
    });

    // Handle updating subscription plan
    settingsForm.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const confirmReset = confirm("Updating your plan will clear your current history and reset the tracker. Are you sure?");
        
        if (confirmReset) {
            appData.planTotal = parseInt(document.getElementById('setTotal').value);
            appData.planPrice = parseInt(document.getElementById('setPrice').value);
            appData.logs = []; // Clear history for the new subscription cycle
            
            saveData();
            document.getElementById('settingsSection').style.display = 'none';
        }
    });

    // Toggle Settings Visibility
    document.getElementById('toggleSettingsBtn').addEventListener('click', function() {
        const section = document.getElementById('settingsSection');
        if (section.style.display === 'none' || section.style.display === '') {
            section.style.display = 'block';
        } else {
            section.style.display = 'none';
        }
    });

    // Run once on initial load
    updateUI();

</script>
</body>
</html>
